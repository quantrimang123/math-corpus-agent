name: Math Corpus Automated Pipeline

on:
  schedule:
    # Chạy tự động vào 0:00 UTC mỗi Chủ Nhật hàng tuần
    - cron: '0 0 * * 0'
  workflow_dispatch: # Cho phép bấm nút "Run workflow" thủ công trên GitHub

jobs:
  run-agent:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install sentence-transformers

      - name: Run Math Agent Script
        run: python main.py

      - name: Upload artifact (Kết quả thu thập)
        uses: actions/upload-artifact@v4
        with:
          name: math-corpus-result
          path: math_corpus_summary.txt
